<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV File Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(640px, 94vw); text-align: center; }
    h1 { margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    textarea { width: 100%; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: .9rem; outline: none; resize: vertical; min-height: 80px; font-family: monospace; }
    textarea:focus { border-color: #60a5fa; }
    .sample-btn { padding: 8px 16px; background: #334155; border: none; border-radius: 6px; color: #e2e8f0; font-size: .85rem; cursor: pointer; transition: background .2s; margin-bottom: 10px; }
    .sample-btn:hover { background: #475569; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; }
    button:hover { background: #1d4ed8; }
    .table-wrapper { margin-top: 18px; overflow-x: auto; max-height: 300px; overflow-y: auto; border-radius: 8px; background: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { background: #1e3a5f; color: #60a5fa; padding: 10px 12px; text-align: left; font-weight: 600; position: sticky; top: 0; }
    td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #cbd5e1; }
    tr:hover td { background: rgba(96, 165, 250, 0.05); }
    .info { color: #94a3b8; font-size: .85rem; margin-top: 8px; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 CSV File Reader</h1>
    <p style="color:#94a3b8;margin-bottom:12px;font-size:.9rem">Paste CSV data below to view it as a table</p>
    <div style="text-align:left;margin-bottom:8px">
      <button class="sample-btn" onclick="loadSample()">📄 Load Sample CSV</button>
    </div>
    <div class="group"><label>CSV Data</label><textarea id="csvInput" rows="4">Name, Age, City, Occupation
Alice Johnson, 28, New York, Engineer
Bob Smith, 35, London, Designer
Charlie Brown, 22, Paris, Student
Diana Prince, 31, Cairo, Archaeologist</textarea></div>
    <button onclick="parseCSV()">Parse CSV</button>
    <div class="table-wrapper" id="tableWrapper"></div>
    <div class="info" id="info"></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function parseCSV() {
      const csv = document.getElementById('csvInput').value;
      const wrapper = document.getElementById('tableWrapper');
      const info = document.getElementById('info');
      if (!csv.trim()) { wrapper.innerHTML = ''; info.textContent = '❌ No CSV data'; return; }
      const lines = csv.split('\n').filter(l => l.trim());
      if (lines.length < 1) { wrapper.innerHTML = ''; info.textContent = '❌ No data rows'; return; }
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = lines.slice(1).map(line => line.split(',').map(c => c.trim()));
      let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      html += rows.map(row => '<tr>' + row.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
      html += '</tbody></table>';
      wrapper.innerHTML = html;
      info.textContent = `📊 ${rows.length} rows × ${headers.length} columns`;
    }
    function loadSample() {
      document.getElementById('csvInput').value = `Name, Age, City, Occupation
Alice Johnson, 28, New York, Engineer
Bob Smith, 35, London, Designer
Charlie Brown, 22, Paris, Student
Diana Prince, 31, Cairo, Archaeologist
Eve Wilson, 27, Tokyo, Developer
Frank Miller, 45, Berlin, Manager`;
      parseCSV();
    }
    parseCSV();
  </script>
</body>
</html>
