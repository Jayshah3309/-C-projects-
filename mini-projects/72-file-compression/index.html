<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Compression Tool</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;display:flex;justify-content:center;align-items:center}
.card{background:rgba(30,41,59,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;width:min(560px,94vw);text-align:center}
h1{margin-bottom:12px;font-size:1.4rem}
.subtitle{color:#94a3b8;font-size:.85rem;margin-bottom:16px}
.group{margin-bottom:14px;text-align:left}
label{display:block;margin-bottom:4px;color:#94a3b8;font-size:.85rem}
textarea, .preview{width:100%;padding:10px 14px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:.9rem;outline:none;resize:vertical;min-height:80px;font-family:monospace}
textarea:focus{border-color:#60a5fa}
button{padding:10px 24px;border:none;border-radius:8px;color:#fff;font-size:.95rem;cursor:pointer;margin:4px;transition:background .2s}
.result{background:#0f172a;border-radius:8px;padding:14px;margin-top:14px;min-height:3em}
.info{color:#94a3b8;font-size:.85rem;margin-top:8px}
.back{display:inline-block;margin-top:12px;color:#94a3b8;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
<h1>🗜️ File Compression Tool</h1>
<p class="subtitle">Run-length encoding + Base64 (simulated compression)</p>
<div class="group"><label>Input text</label><textarea id="inputText" rows="3">AAAAAABBBCCCCCDDEEEEEFFFFFFFFGGGHHH</textarea></div>
<button onclick="compress()" style="background:#2563eb">Compress</button>
<button onclick="decompress()" style="background:#7c3aed">Decompress</button>
<div class="result" id="result"></div>
<div class="info" id="compressInfo"></div>
<a class="back" href="../../index.html">← Back to Hub</a>
</div>
<script>
function compress(){
const text=document.getElementById('inputText').value;
if(!text){document.getElementById('result').innerHTML='❌ No text';return;}
let result='',count=1;
for(let i=0;i<text.length;i++){
if(text[i]===text[i+1])count++;
else{result+=text[i]+count;count=1;}
}
const base64=btoa(text);
const ratio=((result.length/text.length)*100).toFixed(1);
document.getElementById('result').innerHTML=`<div style="color:#4ade80;font-weight:700">RLE: ${result}</div><div style="color:#60a5fa;margin-top:6px;font-size:.85rem">Base64: ${base64.substring(0,60)}${base64.length>60?'...':''}</div>`;
document.getElementById('compressInfo').textContent=`Original: ${text.length} chars | Compressed: ${result.length} chars (${ratio}%)`;
}
function decompress(){
const text=document.getElementById('inputText').value;
if(!text)return;
let result='';
for(let i=0;i<text.length;i+=2){
const ch=text[i],count=parseInt(text[i+1]);
if(!isNaN(count))result+=ch.repeat(count);
else result+=ch;
}
document.getElementById('result').innerHTML=`<div style="color:#4ade80">${result}</div>`;
document.getElementById('compressInfo').textContent=`Decompressed: ${result.length} chars`;
}
</script>
</body>
</html>
