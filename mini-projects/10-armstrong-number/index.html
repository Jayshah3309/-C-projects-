<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armstrong Number Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(420px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.3rem;
      min-height: 3em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .result .verdict { font-weight: 700; font-size: 1.5rem; }
    .result .calc { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; }
    .armstrong { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .not-armstrong { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
    .back { margin-top: 20px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💎 Armstrong Number Checker</h1>
    <p style="color:#94a3b8;margin-bottom:14px;font-size:0.9rem">A number equal to sum of its digits raised to power of number of digits</p>
    <input type="number" id="numInput" value="153" oninput="check()" autofocus />
    <div class="result" id="result"><div class="verdict">153 is Armstrong ✅</div><div class="calc">1³ + 5³ + 3³ = 153</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function check() {
      const val = document.getElementById('numInput').value;
      const el = document.getElementById('result');
      if (val === '') { el.innerHTML = '<div class="verdict">Enter a number</div>'; return; }
      const num = parseInt(val);
      if (isNaN(num) || num < 0) { el.innerHTML = '<div class="verdict">❌ Invalid</div>'; return; }
      const digits = String(num).split('').map(Number);
      const power = digits.length;
      const sum = digits.reduce((acc, d) => acc + Math.pow(d, power), 0);
      const isArm = sum === num;
      if (isArm) {
        const calc = digits.map(d => `${d}<sup>${power}</sup>`).join(' + ');
        el.innerHTML = `<div class="verdict">${num} is Armstrong ✅</div><div class="calc">${calc} = ${num}</div>`;
        el.className = 'result armstrong';
      } else {
        el.innerHTML = `<div class="verdict">${num} is not Armstrong ❌</div><div class="calc">Sum of digits<sup>${power}</sup> = ${sum}</div>`;
        el.className = 'result not-armstrong';
      }
    }
    check();
  </script>
</body>
</html>
