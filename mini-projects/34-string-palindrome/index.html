<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>String Palindrome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(460px, 90vw); text-align: center; }
    h1 { margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1.1rem; outline: none; }
    input:focus { border-color: #60a5fa; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; margin-top: 4px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 18px; padding: 16px; background: #0f172a; border-radius: 8px; font-size: 1.3rem; font-weight: 700; min-height: 3em; }
    .yes { color: #4ade80; } .no { color: #fb923c; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 String Palindrome</h1>
    <p style="color:#94a3b8;margin-bottom:12px;font-size:.9rem">Check if a string reads the same forwards and backwards</p>
    <div class="group"><label>Enter a string</label><input type="text" id="inputStr" value="A man a plan a canal panama" /></div>
    <button onclick="check()">Check</button>
    <div class="result" id="result">Click Check</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function check() {
      const s = document.getElementById('inputStr').value;
      const el = document.getElementById('result');
      const cleaned = s.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
      const rev = cleaned.split('').reverse().join('');
      const isPal = cleaned === rev;
      el.textContent = isPal ? `✅ "${s}" is a palindrome!` : `❌ "${s}" is not a palindrome`;
      el.className = `result ${isPal ? 'yes' : 'no'}`;
    }
    check();
  </script>
</body>
</html>
