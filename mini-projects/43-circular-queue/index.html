<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Queue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(520px, 90vw); text-align: center; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .controls input { padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; width: 100px; }
    .controls input:focus { border-color: #60a5fa; }
    .controls button { padding: 10px 14px; border: none; border-radius: 8px; color: #fff; font-size: .85rem; cursor: pointer; transition: background .2s; }
    .enq-btn { background: #2563eb; } .enq-btn:hover { background: #1d4ed8; }
    .deq-btn { background: #dc2626; } .deq-btn:hover { background: #b91c1c; }
    .clear-btn { background: #475569; } .clear-btn:hover { background: #64748b; }
    .circle-display { position: relative; width: 200px; height: 200px; margin: 0 auto 16px; }
    .circle-item { position: absolute; width: 56px; height: 56px; background: #1e3a5f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: monospace; font-size: 1rem; color: #60a5fa; transition: all .3s; }
    .circle-item.occupied { border: 2px solid #60a5fa; }
    .circle-item.front { border-color: #4ade80; color: #4ade80; }
    .circle-item.rear { border-color: #fb923c; color: #fb923c; }
    .circle-item.empty-slot { background: #0f172a; border: 1px dashed #334155; color: #334155; }
    .info { color: #94a3b8; font-size: .9rem; margin-bottom: 8px; }
    .back { margin-top: 16px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔄 Circular Queue</h1>
    <p class="subtitle">Fixed-size queue that wraps around (max 8)</p>
    <div class="controls">
      <input type="number" id="cqInput" value="42" placeholder="Val" />
      <button class="enq-btn" onclick="enqueue()">Enqueue</button>
      <button class="deq-btn" onclick="dequeue()">Dequeue</button>
      <button class="clear-btn" onclick="clearCQ()">Clear</button>
    </div>
    <div id="circleDisplay" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:80px;background:#0f172a;border-radius:8px;padding:16px;margin-bottom:8px"></div>
    <div class="info" id="cqInfo">Size: 8 | Front: -1 | Rear: -1</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    const MAX = 8;
    const cq = new Array(MAX).fill(null);
    let front = -1, rear = -1;
    function render() {
      const display = document.getElementById('circleDisplay');
      const info = document.getElementById('cqInfo');
      display.innerHTML = cq.map((val, i) => {
        let cls = 'empty-slot';
        let label = '∅';
        if (val !== null) { cls = 'occupied'; label = val; }
        if (i === front) cls += ' front';
        if (i === rear) cls += ' rear';
        let extra = '';
        if (i === front) extra += ' FRONT';
        if (i === rear) extra += ' REAR';
        return `<div class="circle-item ${cls}" style="width:56px;height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center">${label}${extra ? `<span style="font-size:.6rem;color:inherit">${extra}</span>` : ''}</div>`;
      }).join('');
      info.textContent = `Size: ${MAX} | Front: ${front} (${front >= 0 ? cq[front] : 'none'}) | Rear: ${rear} (${rear >= 0 ? cq[rear] : 'none'}) | Count: ${cq.filter(x => x !== null).length}`;
    }
    function enqueue() {
      const val = document.getElementById('cqInput').value;
      if (val === '') return;
      if ((rear + 1) % MAX === front) { alert('Queue is full!'); return; }
      const v = isNaN(Number(val)) ? val : Number(val);
      if (front === -1) { front = 0; rear = 0; }
      else { rear = (rear + 1) % MAX; }
      cq[rear] = v;
      render();
    }
    function dequeue() {
      if (front === -1) { alert('Queue is empty!'); return; }
      cq[front] = null;
      if (front === rear) { front = -1; rear = -1; }
      else { front = (front + 1) % MAX; }
      render();
    }
    function clearCQ() { cq.fill(null); front = -1; rear = -1; render(); }
    render();
  </script>
</body>
</html>
