<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(420px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    .group { margin-bottom: 16px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #60a5fa; }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .result {
      margin-top: 18px;
      padding: 14px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 1.3rem;
      min-height: 3em;
    }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌡️ Temperature Converter</h1>
    <div class="group">
      <label>Value</label>
      <input type="number" id="tempValue" value="100" />
    </div>
    <div class="group">
      <label>From</label>
      <select id="fromUnit"><option value="celsius">Celsius</option><option value="fahrenheit">Fahrenheit</option><option value="kelvin">Kelvin</option></select>
    </div>
    <div class="group">
      <label>To</label>
      <select id="toUnit"><option value="fahrenheit">Fahrenheit</option><option value="celsius">Celsius</option><option value="kelvin">Kelvin</option></select>
    </div>
    <button onclick="convert()">Convert</button>
    <div class="result" id="result">--</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function convert() {
      const val = parseFloat(document.getElementById('tempValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      if (isNaN(val)) { document.getElementById('result').textContent = '❌ Enter a valid number'; return; }
      let celsius;
      if (from === 'celsius') celsius = val;
      else if (from === 'fahrenheit') celsius = (val - 32) * 5 / 9;
      else celsius = val - 273.15;
      let result;
      if (to === 'celsius') result = celsius;
      else if (to === 'fahrenheit') result = (celsius * 9 / 5) + 32;
      else result = celsius + 273.15;
      document.getElementById('result').textContent = `${val}° ${from[0].toUpperCase() + from.slice(1)} = ${result.toFixed(2)}° ${to[0].toUpperCase() + to.slice(1)}`;
    }
    convert();
  </script>
</body>
</html>
