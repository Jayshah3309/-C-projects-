<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polynomial Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(540px, 90vw); text-align: center; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; }
    input:focus { border-color: #60a5fa; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; margin-top: 4px; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 18px; padding: 14px; background: #0f172a; border-radius: 8px; font-size: 1rem; min-height: 3em; line-height: 1.6; }
    .poly-display { color: #60a5fa; font-family: monospace; font-size: 1.1rem; }
    .eval-display { color: #4ade80; font-weight: 700; font-size: 1.4rem; margin-top: 6px; }
    .info { color: #94a3b8; font-size: .85rem; }
    .back { margin-top: 14px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📈 Polynomial Calculator</h1>
    <p class="subtitle">Evaluate P(x) = aₙxⁿ + ... + a₁x + a₀ at given x</p>
    <div class="group"><label>Coefficients (comma-separated, highest degree first)</label><input type="text" id="coeffs" value="3, -5, 2, 7" placeholder="e.g. 3, -5, 2, 7" /></div>
    <div class="group"><label>Value of x</label><input type="number" id="xValue" value="2" step="0.5" /></div>
    <button onclick="calculate()">Evaluate P(x)</button>
    <div class="result" id="result"><div class="poly-display">P(x) = 3x³ - 5x² + 2x + 7</div><div class="eval-display">P(2) = 15</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function calculate() {
      const coeffsStr = document.getElementById('coeffs').value;
      const x = parseFloat(document.getElementById('xValue').value);
      const el = document.getElementById('result');
      const coeffs = coeffsStr.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
      if (coeffs.length === 0 || isNaN(x)) { el.innerHTML = '❌ Enter valid coefficients and x value'; return; }

      // Display polynomial
      const polyParts = coeffs.map((c, i) => {
        const deg = coeffs.length - 1 - i;
        if (c === 0) return '';
        const sign = c > 0 && i > 0 ? '+' : '';
        const abs = Math.abs(c);
        const coefStr = abs === 1 && deg > 0 ? '' : abs;
        if (deg === 0) return `${sign}${c}`;
        if (deg === 1) return `${sign}${coefStr}x`;
        return `${sign}${coefStr}x<sup>${deg}</sup>`;
      }).filter(p => p).join(' ');

      // Evaluate using Horner's method
      let result = 0;
      for (const c of coeffs) result = result * x + c;

      el.innerHTML = `<div class="poly-display">P(x) = ${polyParts}</div><div class="eval-display">P(${x}) = ${result}</div>`;
    }
  </script>
</body>
</html>
