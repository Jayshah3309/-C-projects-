<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(540px, 90vw); text-align: center; }
    h1 { margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    textarea { width: 100%; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; resize: vertical; min-height: 100px; font-family: inherit; }
    textarea:focus { border-color: #60a5fa; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .stat-box { background: #0f172a; border-radius: 8px; padding: 12px; }
    .stat-box .num { font-size: 1.6rem; font-weight: 700; color: #60a5fa; }
    .stat-box .label { font-size: .8rem; color: #94a3b8; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 Word Counter</h1>
    <div class="group"><label>Enter text</label><textarea id="textInput" oninput="count()" placeholder="Type or paste your text here...">The quick brown fox jumps over the lazy dog.</textarea></div>
    <div class="stats" id="stats">
      <div class="stat-box"><div class="num" id="wordCount">9</div><div class="label">Words</div></div>
      <div class="stat-box"><div class="num" id="charCount">44</div><div class="label">Characters</div></div>
      <div class="stat-box"><div class="num" id="sentenceCount">1</div><div class="label">Sentences</div></div>
    </div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function count() {
      const text = document.getElementById('textInput').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const sentences = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim()).length : 0;
      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = chars;
      document.getElementById('sentenceCount').textContent = sentences;
    }
    count();
  </script>
</body>
</html>
