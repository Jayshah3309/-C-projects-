<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factorial Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(420px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .result {
      margin-top: 18px;
      padding: 14px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 1.3rem;
      min-height: 3em;
    }
    .result .big { font-size: 2rem; font-weight: 700; color: #60a5fa; }
    .result .detail { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>❗ Factorial Calculator</h1>
    <div class="group">
      <label>Enter n (0 ≤ n ≤ 170)</label>
      <input type="number" id="numInput" value="7" min="0" max="170" />
    </div>
    <button onclick="calculate()">Calculate n!</button>
    <div class="result" id="result"><div class="big">5040</div><div class="detail">7! = 7 × 6 × 5 × 4 × 3 × 2 × 1</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function calculate() {
      const n = parseInt(document.getElementById('numInput').value);
      const el = document.getElementById('result');
      if (isNaN(n) || n < 0 || n > 170) { el.innerHTML = '<div class="big">❌</div><div class="detail">Enter a number between 0 and 170</div>'; return; }
      if (n === 0 || n === 1) { el.innerHTML = `<div class="big">1</div><div class="detail">${n}! = 1</div>`; return; }
      let fact = 1;
      const parts = [];
      for (let i = 2; i <= n; i++) { fact *= i; parts.push(i); }
      el.innerHTML = `<div class="big">${fact.toLocaleString()}</div><div class="detail">${n}! = ${n} × ${parts.slice(0, -1).join(' × ')} × 1</div>`;
    }
    calculate();
  </script>
</body>
</html>
