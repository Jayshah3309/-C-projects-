<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Reversal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(420px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    .result {
      margin-top: 24px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      font-size: 1.5rem;
      min-height: 3em;
    }
    .result .original { color: #94a3b8; font-size: 1rem; }
    .result .reversed { font-size: 2rem; font-weight: 700; color: #60a5fa; margin-top: 4px; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔁 Number Reversal</h1>
    <div class="group">
      <label>Enter a number</label>
      <input type="number" id="numInput" value="12345" oninput="reverse()" />
    </div>
    <div class="result" id="result"><div class="original">Original: 12345</div><div class="reversed">Reversed: 54321</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function reverse() {
      const val = document.getElementById('numInput').value;
      const el = document.getElementById('result');
      if (val === '') { el.innerHTML = '<div class="original">Enter a number</div>'; return; }
      const num = parseInt(val);
      if (isNaN(num)) { el.innerHTML = '<div class="original">❌ Invalid</div>'; return; }
      const rev = Math.abs(num).toString().split('').reverse().join('');
      const result = num < 0 ? '-' + rev : rev;
      el.innerHTML = `<div class="original">Original: ${num}</div><div class="reversed">Reversed: ${result}</div>`;
    }
    reverse();
  </script>
</body>
</html>
