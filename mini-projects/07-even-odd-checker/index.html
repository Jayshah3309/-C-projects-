<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even/Odd Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(400px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.6rem;
      font-weight: 700;
      min-height: 3em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .even { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .odd { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
    .back { margin-top: 20px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔢 Even / Odd Checker</h1>
    <input type="number" id="numInput" value="7" oninput="check()" autofocus />
    <div class="result" id="result">7 is Odd</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function check() {
      const val = document.getElementById('numInput').value;
      if (val === '') { document.getElementById('result').textContent = 'Enter a number'; return; }
      const num = parseInt(val);
      if (isNaN(num)) { document.getElementById('result').textContent = '❌ Invalid'; return; }
      const el = document.getElementById('result');
      if (num % 2 === 0) { el.textContent = `${num} is Even`; el.className = 'result even'; }
      else { el.textContent = `${num} is Odd`; el.className = 'result odd'; }
    }
    check();
  </script>
</body>
</html>
