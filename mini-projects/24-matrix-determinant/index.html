<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrix Determinant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(600px, 95vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    .row-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    .group { text-align: left; min-width: 80px; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.85rem; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #e2e8f0; text-align: center; outline: none; }
    input:focus { border-color: #60a5fa; }
    .matrix-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; display: inline-block; }
    .matrix-box td { padding: 4px; }
    .matrix-box input { width: 56px; padding: 6px; text-align: center; font-size: 1rem; }
    .matrix-box .bracket { font-size: 2rem; color: #94a3b8; padding: 0 4px; vertical-align: middle; }
    .result { margin-top: 18px; padding: 16px; background: #0f172a; border-radius: 8px; }
    .result .det { font-size: 2rem; font-weight: 700; color: #4ade80; }
    .result .detail { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
    .note { color: #f87171; font-size: 0.85rem; margin: 6px 0; }
    button { padding: 10px 28px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📐 Matrix Determinant</h1>
    <div class="row-group">
      <div class="group"><label>Size (n×n)</label><input type="number" id="size" value="3" min="2" max="5" /></div>
      <button onclick="build()">Set</button>
    </div>
    <div id="matrixArea" class="matrix-box" style="display:inline-block"></div>
    <div class="result" id="result"><div class="det">--</div><div class="detail">Enter a square matrix</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function determinant(m) {
      const n = m.length;
      if (n === 1) return m[0][0];
      if (n === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];
      let det = 0;
      for (let col = 0; col < n; col++) {
        const sub = m.slice(1).map(row => row.filter((_, j) => j !== col));
        det += (col % 2 === 0 ? 1 : -1) * m[0][col] * determinant(sub);
      }
      return det;
    }
    function build() {
      const n = Math.min(5, Math.max(2, parseInt(document.getElementById('size').value) || 3));
      document.getElementById('size').value = n;
      let html = '<table><tr><td class="bracket">|</td>';
      html += '<td><table>';
      for (let i = 0; i < n; i++) {
        html += '<tr>';
        for (let j = 0; j < n; j++) html += `<td><input type="number" id="M${i}${j}" value="${i === j ? i + 1 : (i + j + 1)}" oninput="calc()" /></td>`;
        html += '</tr>';
      }
      html += '</table></td><td class="bracket">|</td></tr></table>';
      document.getElementById('matrixArea').innerHTML = html;
      calc();
    }
    function calc() {
      const n = parseInt(document.getElementById('size').value);
      const matrix = Array.from({length: n}, (_, i) => Array.from({length: n}, (_, j) => parseFloat(document.getElementById(`M${i}${j}`).value) || 0));
      const det = determinant(matrix);
      const el = document.getElementById('result');
      el.innerHTML = `<div class="det">det = ${det.toFixed(2)}</div><div class="detail">${n}×${n} matrix determinant</div>`;
    }
    build();
  </script>
</body>
</html>
