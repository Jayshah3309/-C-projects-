<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expression Evaluator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(500px, 90vw); text-align: center; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1.1rem; outline: none; font-family: monospace; }
    input:focus { border-color: #60a5fa; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 18px; padding: 16px; background: #0f172a; border-radius: 8px; font-size: 1.3rem; min-height: 3em; }
    .result .value { font-size: 2rem; font-weight: 700; color: #4ade80; }
    .result .steps { font-size: .85rem; color: #94a3b8; margin-top: 4px; }
    .back { margin-top: 16px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧮 Expression Evaluator</h1>
    <p class="subtitle">Supports +, -, *, /, %, ^, parentheses</p>
    <div class="group"><label>Expression</label><input type="text" id="exprInput" value="3 + 4 * 2 / (1 - 5) ^ 2" /></div>
    <button onclick="evaluate()">Evaluate</button>
    <div class="result" id="result"><div class="value">3.5</div><div class="steps">Result: 3.5</div></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function evaluate() {
      const expr = document.getElementById('exprInput').value;
      const el = document.getElementById('result');
      try {
        // Replace ^ with ** for power
        const sanitized = expr.replace(/\^/g, '**');
        const result = Function('"use strict"; return (' + sanitized + ')')();
        el.innerHTML = `<div class="value">${result}</div><div class="steps">${expr} = ${result}</div>`;
      } catch (e) {
        el.innerHTML = `<div style="color:#fb923c;font-size:1.5rem">❌ Error</div><div class="steps">Invalid expression</div>`;
      }
    }
  </script>
</body>
</html>
