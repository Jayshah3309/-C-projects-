<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px;
      width: min(400px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 8px; font-size: 2rem; }
    .highlight { color: #60a5fa; }
    input {
      width: 100%;
      padding: 10px 14px;
      margin: 16px 0;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .message {
      margin-top: 20px;
      font-size: 1.2rem;
      min-height: 2em;
    }
    .back { margin-top: 20px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌍 Hello <span class="highlight">World</span></h1>
    <p>Enter your name to get a personalized greeting!</p>
    <input type="text" id="nameInput" placeholder="Enter your name..." autofocus />
    <button onclick="greet()">Say Hello</button>
    <div class="message" id="message"></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function greet() {
      const name = document.getElementById('nameInput').value.trim() || 'World';
      document.getElementById('message').textContent = `Hello, ${name}! 👋`;
    }
    document.getElementById('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') greet(); });
  </script>
</body>
</html>
