<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuration Parser</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;display:flex;justify-content:center;align-items:center}
.card{background:rgba(30,41,59,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;width:min(580px,94vw)}
h1{margin-bottom:12px;font-size:1.4rem}
.subtitle{color:#94a3b8;font-size:.85rem;margin-bottom:14px}
textarea{width:100%;padding:10px 14px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:.85rem;outline:none;resize:vertical;min-height:100px;font-family:monospace}
textarea:focus{border-color:#60a5fa}
button{padding:10px 24px;border:none;border-radius:8px;color:#fff;font-size:.9rem;cursor:pointer;margin:6px 0;transition:background .2s}
.result{background:#0f172a;border-radius:8px;padding:14px;margin-top:12px;min-height:3em}
.config-row{display:flex;justify-content:space-between;padding:5px 8px;font-family:monospace;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,0.04)}
.config-row .key{color:#60a5fa;font-weight:600}
.config-row .val{color:#4ade80}
.config-row .section{color:#7c3aed;font-weight:600}
.info{color:#94a3b8;font-size:.85rem;margin-top:8px}
.back{display:inline-block;margin-top:10px;color:#94a3b8;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
<h1>⚙️ Configuration Parser</h1>
<p class="subtitle">Parse INI-style configuration files</p>
<textarea id="configInput" rows="5">[database]
host = localhost
port = 5432
name = myapp_db

[server]
host = 0.0.0.0
port = 8080
debug = true

[logging]
level = INFO
file = /var/log/app.log</textarea>
<button onclick="parseConfig()" style="background:#2563eb">Parse Config</button>
<div class="result" id="configResult"></div>
<div class="info" id="configInfo"></div>
<a class="back" href="../../index.html">← Back to Hub</a>
</div>
<script>
function parseConfig(){
const text=document.getElementById('configInput').value;
const lines=text.split('\n');
let currentSection='global';
const config={global:{}};
lines.forEach(line=>{
const trimmed=line.trim();
if(!trimmed||trimmed.startsWith(';')||trimmed.startsWith('#'))return;
const sectionMatch=trimmed.match(/^\s*\[(.+?)\]\s*$/);
if(sectionMatch){currentSection=sectionMatch[1];if(!config[currentSection])config[currentSection]={};return;}
const eqIdx=trimmed.indexOf('=');
if(eqIdx===-1)return;
const key=trimmed.substring(0,eqIdx).trim();
let val=trimmed.substring(eqIdx+1).trim();
if(val.toLowerCase()==='true')val=true;
else if(val.toLowerCase()==='false')val=false;
else if(!isNaN(Number(val)))val=Number(val);
config[currentSection][key]=val;
});
let html='';
let total=0;
for(const[section,keys]of Object.entries(config)){
if(Object.keys(keys).length>0){
html+=`<div class="config-row"><span class="section">[${section}]</span></div>`;
for(const[key,val]of Object.entries(keys)){
html+=`<div class="config-row"><span class="key">${key}</span><span class="val">${val}</span></div>`;
total++;
}
}
}
document.getElementById('configResult').innerHTML=html||'<div style="color:#475569">No config entries found</div>';
document.getElementById('configInfo').textContent=`Parsed ${total} entries across ${Object.keys(config).length} sections`;
}
parseConfig();
</script>
</body>
</html>
