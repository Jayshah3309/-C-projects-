<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Process Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; width: min(640px, 94vw); }
    h1 { margin-bottom: 14px; font-size: 1.4rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .controls button { padding: 8px 16px; border: none; border-radius: 6px; color: #fff; font-size: .85rem; cursor: pointer; transition: background .2s; }
    .controls input { padding: 8px 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: .85rem; outline: none; width: 120px; }
    .table-wrapper { overflow-x: auto; background: #0f172a; border-radius: 8px; max-height: 320px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th { background: #1e3a5f; color: #60a5fa; padding: 8px 10px; text-align: left; position: sticky; top: 0; font-weight: 600; }
    td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); font-family: monospace; }
    .running { color: #4ade80; } .stopped { color: #dc2626; }
    .info { color: #94a3b8; font-size: .85rem; margin-top: 8px; }
    .back { display: inline-block; margin-top: 12px; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔄 Process Monitor</h1>
    <div class="controls">
      <input type="text" id="procName" value="Process-A" placeholder="Name" />
      <button onclick="addProcess()" style="background:#2563eb">➕ Add</button>
      <button onclick="stopProcess()" style="background:#dc2626">⏹ Stop</button>
      <button onclick="startProcess()" style="background:#059669">▶ Start</button>
      <button onclick="killAll()" style="background:#475569">🗑 Kill All</button>
    </div>
    <div class="table-wrapper">
      <table><thead><tr><th>PID</th><th>Name</th><th>Status</th><th>CPU %</th><th>Mem KB</th><th>Uptime</th><th>Action</th></tr></thead><tbody id="procTable"></tbody></table>
    </div>
    <div class="info" id="procInfo">Processes: 0</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    let procs = [];
    let pidCounter = 100;
    function addProcess() {
      const name = document.getElementById('procName').value.trim() || 'Process';
      procs.push({ pid: pidCounter++, name, status: 'running', cpu: (Math.random() * 20 + 1).toFixed(1), mem: Math.floor(Math.random() * 500 + 50), start: Date.now() });
      render();
    }
    function stopProcess() {
      const running = procs.filter(p => p.status === 'running');
      if (running.length === 0) return;
      const idx = procs.indexOf(running[0]);
      procs[idx].status = 'stopped'; render();
    }
    function startProcess() {
      const stopped = procs.filter(p => p.status === 'stopped');
      if (stopped.length === 0) return;
      const idx = procs.indexOf(stopped[0]);
      procs[idx].status = 'running'; render();
    }
    function killAll() { procs = []; render(); }
    function killProc(pid) { procs = procs.filter(p => p.pid !== pid); render(); }
    function render() {
      const tbody = document.getElementById('procTable');
      document.getElementById('procInfo').textContent = `Processes: ${procs.length} (${procs.filter(p => p.status === 'running').length} running)`;
      tbody.innerHTML = procs.map(p => {
        const uptime = Math.floor((Date.now() - p.start) / 1000);
        const min = Math.floor(uptime / 60), sec = uptime % 60;
        return `<tr><td>${p.pid}</td><td>${p.name}</td><td class="${p.status}">${p.status}</td><td>${p.cpu}%</td><td>${p.mem}</td><td>${min}m ${sec}s</td><td><button onclick="killProc(${p.pid})" style="background:#dc2626;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:.75rem;padding:4px 8px">Kill</button></td></tr>`;
      }).join('');
    }
    // Add sample processes
    ['System', 'Browser', 'Editor', 'Shell'].forEach(n => { 
      procs.push({ pid: pidCounter++, name: n, status: 'running', cpu: (Math.random() * 15 + 1).toFixed(1), mem: Math.floor(Math.random() * 400 + 30), start: Date.now() });
    });
    render();
  </script>
</body>
</html>
