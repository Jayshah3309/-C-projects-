<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(500px, 90vw); text-align: center; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .controls input { padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; width: 120px; }
    .controls input:focus { border-color: #60a5fa; }
    .controls button { padding: 10px 16px; border: none; border-radius: 8px; color: #fff; font-size: .9rem; cursor: pointer; transition: background .2s; }
    .enq-btn { background: #2563eb; } .enq-btn:hover { background: #1d4ed8; }
    .deq-btn { background: #dc2626; } .deq-btn:hover { background: #b91c1c; }
    .front-btn { background: #7c3aed; } .front-btn:hover { background: #6d28d9; }
    .clear-btn { background: #475569; } .clear-btn:hover { background: #64748b; }
    .queue-display { display: flex; gap: 6px; min-height: 60px; overflow-x: auto; background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .queue-item { background: #1e3a5f; color: #60a5fa; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-family: monospace; font-size: 1rem; white-space: nowrap; }
    .queue-item.front { border: 2px solid #4ade80; }
    .queue-item.rear { border: 2px solid #fb923c; }
    .arrow { color: #475569; font-size: 1.2rem; }
    .info { color: #94a3b8; font-size: .9rem; }
    .back { margin-top: 16px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 Queue (FIFO)</h1>
    <p class="subtitle">First-In, First-Out data structure</p>
    <div class="controls">
      <input type="number" id="queueInput" value="42" placeholder="Value" />
      <button class="enq-btn" onclick="enqueue()">Enqueue</button>
      <button class="deq-btn" onclick="dequeue()">Dequeue</button>
      <button class="front-btn" onclick="peekFront()">Front</button>
      <button class="clear-btn" onclick="clearQueue()">Clear</button>
    </div>
    <div class="queue-display" id="queueDisplay"></div>
    <div class="info" id="queueInfo">Queue is empty</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    const queue = [];
    function render() {
      const display = document.getElementById('queueDisplay');
      const info = document.getElementById('queueInfo');
      if (queue.length === 0) { display.innerHTML = '<div style="color:#475569;padding:20px 0">Queue is empty</div>'; info.textContent = 'Size: 0'; return; }
      display.innerHTML = queue.map((val, i) => {
        let extra = '';
        if (i === 0 && queue.length > 0) extra = ' (FRONT)';
        else if (i === queue.length - 1) extra = ' (REAR)';
        return `<div class="queue-item${i === 0 ? ' front' : i === queue.length - 1 ? ' rear' : ''}">${val}${extra}</div>` + (i < queue.length - 1 ? '<span class="arrow">→</span>' : '');
      }).join('');
      info.textContent = `Size: ${queue.length} | Front: ${queue[0] || 'none'} | Rear: ${queue[queue.length - 1] || 'none'}`;
    }
    function enqueue() {
      const val = document.getElementById('queueInput').value;
      if (val === '') return;
      queue.push(isNaN(Number(val)) ? val : Number(val));
      render(); document.getElementById('queueInput').value = ''; document.getElementById('queueInput').focus();
    }
    function dequeue() {
      if (queue.length === 0) { alert('Queue is empty!'); return; }
      queue.shift(); render();
    }
    function peekFront() {
      if (queue.length === 0) { alert('Queue is empty!'); return; }
      alert(`Front element: ${queue[0]}`);
    }
    function clearQueue() { queue.length = 0; render(); }
    render();
  </script>
</body>
</html>
