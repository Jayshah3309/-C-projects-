<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(500px, 90vw); text-align: center; }
    h1 { margin-bottom: 16px; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: .9rem; }
    input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; }
    input:focus, textarea:focus { border-color: #60a5fa; }
    textarea { resize: vertical; min-height: 60px; font-family: monospace; }
    button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-size: 1rem; cursor: pointer; transition: background .2s; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 18px; padding: 14px; background: #0f172a; border-radius: 8px; font-size: 1.1rem; min-height: 3em; }
    .found { color: #4ade80; } .not-found { color: #fb923c; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 Binary Search</h1>
    <p style="color:#94a3b8;font-size:.9rem;margin-bottom:12px">Array must be sorted in ascending order</p>
    <div class="group"><label>Sorted Array (comma-separated)</label><textarea id="arrayInput" rows="2">1, 3, 5, 7, 9, 11, 13, 15, 17</textarea></div>
    <div class="group"><label>Search for</label><input type="number" id="searchVal" value="7" /></div>
    <button onclick="search()">Binary Search</button>
    <div class="result" id="result">Click Search to begin</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function search() {
      const arr = document.getElementById('arrayInput').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
      const target = parseInt(document.getElementById('searchVal').value);
      const el = document.getElementById('result');
      if (arr.length === 0 || isNaN(target)) { el.innerHTML = '❌ Enter valid data'; return; }
      let left = 0, right = arr.length - 1, steps = 0, found = false, mid;
      while (left <= right) {
        steps++;
        mid = Math.floor((left + right) / 2);
        if (arr[mid] === target) { found = true; break; }
        else if (arr[mid] < target) left = mid + 1;
        else right = mid - 1;
      }
      if (found) el.innerHTML = `<span class="found">✅ Found ${target} at index [${mid}]</span><br><span style="font-size:.85rem;color:#94a3b8">Steps: ${steps} | Array: ${arr.join(', ')}</span>`;
      else el.innerHTML = `<span class="not-found">❌ ${target} not found</span><br><span style="font-size:.85rem;color:#94a3b8">Steps: ${steps} | Array: ${arr.join(', ')}</span>`;
    }
  </script>
</body>
</html>
