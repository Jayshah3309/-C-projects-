<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCD &amp; LCM Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      width: min(420px, 90vw);
      text-align: center;
    }
    h1 { margin-bottom: 20px; font-size: 1.8rem; }
    .group { margin-bottom: 14px; text-align: left; }
    label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    .row { display: flex; gap: 10px; }
    .row .group { flex: 1; }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .result {
      margin-top: 18px;
      padding: 14px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 1.2rem;
      min-height: 3em;
    }
    .result .gcd { color: #4ade80; font-weight: 700; }
    .result .lcm { color: #60a5fa; font-weight: 700; }
    .back { margin-top: 18px; display: inline-block; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔢 GCD &amp; LCM Calculator</h1>
    <div class="row">
      <div class="group">
        <label>Number A</label>
        <input type="number" id="numA" value="12" />
      </div>
      <div class="group">
        <label>Number B</label>
        <input type="number" id="numB" value="18" />
      </div>
    </div>
    <button onclick="calculate()">Calculate</button>
    <div class="result" id="result"><span class="gcd">GCD = 6</span> &nbsp;|&nbsp; <span class="lcm">LCM = 36</span></div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
    function lcm(a, b) { if (a === 0 || b === 0) return 0; return Math.abs(a * b) / gcd(a, b); }
    function calculate() {
      const a = parseInt(document.getElementById('numA').value);
      const b = parseInt(document.getElementById('numB').value);
      const el = document.getElementById('result');
      if (isNaN(a) || isNaN(b)) { el.innerHTML = '❌ Enter valid numbers'; return; }
      const g = gcd(a, b);
      const l = lcm(a, b);
      el.innerHTML = `<span class="gcd">GCD = ${g}</span> &nbsp;|&nbsp; <span class="lcm">LCM = ${l}</span>`;
    }
    calculate();
  </script>
</body>
</html>
