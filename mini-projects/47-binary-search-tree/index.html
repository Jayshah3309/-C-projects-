<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary Search Tree</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; display: flex; justify-content: center; align-items: center; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; width: min(580px, 94vw); text-align: center; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-bottom: 16px; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
    .controls input { padding: 8px 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: .9rem; outline: none; width: 80px; }
    .controls input:focus { border-color: #60a5fa; }
    .controls button { padding: 8px 12px; border: none; border-radius: 6px; color: #fff; font-size: .8rem; cursor: pointer; transition: background .2s; }
    .ins-btn { background: #2563eb; } .ins-btn:hover { background: #1d4ed8; }
    .rem-btn { background: #dc2626; } .rem-btn:hover { background: #b91c1c; }
    .find-btn { background: #7c3aed; } .find-btn:hover { background: #6d28d9; }
    .clr-btn { background: #475569; } .clr-btn:hover { background: #64748b; }
    .tree-display { background: #0f172a; border-radius: 8px; padding: 16px; min-height: 80px; margin-bottom: 8px; overflow-x: auto; }
    .tree-line { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .tree-node { background: #1e3a5f; color: #60a5fa; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-family: monospace; }
    .tree-node.root { border: 2px solid #4ade80; }
    .tree-node.null-node { background: transparent; color: #334155; font-size: .8rem; }
    .traversals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 8px 0; }
    .trav-box { background: #0f172a; border-radius: 6px; padding: 8px; font-size: .8rem; }
    .trav-box .label { color: #94a3b8; font-size: .7rem; }
    .trav-box .val { color: #60a5fa; font-weight: 600; font-family: monospace; }
    .info { color: #94a3b8; font-size: .85rem; }
    .back { margin-top: 14px; display: inline-block; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌳 Binary Search Tree</h1>
    <p class="subtitle">Insert, Delete, Search &amp; Traversals</p>
    <div class="controls">
      <input type="number" id="bstInput" value="50" placeholder="Val" />
      <button class="ins-btn" onclick="insert()">Insert</button>
      <button class="rem-btn" onclick="removeNode()">Remove</button>
      <button class="find-btn" onclick="searchNode()">Search</button>
      <button class="clr-btn" onclick="clearTree()">Clear</button>
    </div>
    <div class="tree-display" id="treeDisplay"></div>
    <div class="traversals">
      <div class="trav-box"><div class="label">In-order</div><div class="val" id="inorder">-</div></div>
      <div class="trav-box"><div class="label">Pre-order</div><div class="val" id="preorder">-</div></div>
      <div class="trav-box"><div class="label">Post-order</div><div class="val" id="postorder">-</div></div>
    </div>
    <div class="info" id="bstInfo">Size: 0</div>
    <a class="back" href="../../index.html">← Back to Hub</a>
  </div>
  <script>
    let bst = [];

    function insertNode(root, val) {
      if (root === null) return {val, left: null, right: null};
      if (val < root.val) root.left = insertNode(root.left, val);
      else if (val > root.val) root.right = insertNode(root.right, val);
      return root;
    }

    function minNode(root) { while (root && root.left) root = root.left; return root; }

    function deleteNode(root, val) {
      if (root === null) return null;
      if (val < root.val) { root.left = deleteNode(root.left, val); return root; }
      if (val > root.val) { root.right = deleteNode(root.right, val); return root; }
      if (root.left === null) return root.right;
      if (root.right === null) return root.left;
      const min = minNode(root.right);
      root.val = min.val;
      root.right = deleteNode(root.right, min.val);
      return root;
    }

    function searchNodeBST(root, val) {
      if (root === null) return false;
      if (root.val === val) return true;
      return val < root.val ? searchNodeBST(root.left, val) : searchNodeBST(root.right, val);
    }

    function inorder(root, acc = []) { if (root) { inorder(root.left, acc); acc.push(root.val); inorder(root.right, acc); } return acc; }
    function preorder(root, acc = []) { if (root) { acc.push(root.val); preorder(root.left, acc); preorder(root.right, acc); } return acc; }
    function postorder(root, acc = []) { if (root) { postorder(root.left, acc); postorder(root.right, acc); acc.push(root.val); } return acc; }

    function height(root) { if (!root) return 0; return 1 + Math.max(height(root.left), height(root.right)); }

    let root = null;

    function render() {
      const display = document.getElementById('treeDisplay');
      const info = document.getElementById('bstInfo');
      const h = height(root);
      if (!root) { display.innerHTML = '<div style="color:#475569;">Empty tree</div>'; info.textContent = 'Size: 0'; }
      else {
        // Show tree level by level as simple text
        const inOrd = inorder(root);
        display.innerHTML = `<div style="color:#94a3b8;font-size:.85rem">Root: ${root.val} | Height: ${h} | Nodes: ${inOrd.length}</div><div style="color:#60a5fa;font-family:monospace;margin-top:4px">In-order: [${inOrd.join(', ')}]</div>`;
      }
      document.getElementById('inorder').textContent = root ? inorder(root).join(', ') : '-';
      document.getElementById('preorder').textContent = root ? preorder(root).join(', ') : '-';
      document.getElementById('postorder').textContent = root ? postorder(root).join(', ') : '-';
      info.textContent = `Size: ${root ? inorder(root).length : 0} | Root: ${root ? root.val : 'none'}`;
    }

    function insert() { const v = parseInt(document.getElementById('bstInput').value); if (isNaN(v)) return; root = insertNode(root, v); render(); }
    function removeNode() { const v = parseInt(document.getElementById('bstInput').value); if (isNaN(v)) return; root = deleteNode(root, v); render(); }
    function searchNode() { const v = parseInt(document.getElementById('bstInput').value); if (isNaN(v)) return; alert(searchNodeBST(root, v) ? `Found ${v}` : `${v} not found`); }
    function clearTree() { root = null; render(); }
    render();
  </script>
</body>
</html>
